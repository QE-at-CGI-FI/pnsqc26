            <stop offset="0%" stop-color="#f4e4a6" stop-opacity="0.9"/>
            <stop offset="100%" stop-color="#4a1c6b"/>
        </radialGradient>
        <linearGradient id="liquid" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#7fd4ff"/>
            <stop offset="100%" stop-color="#3a5bd9"/>
        </linearGradient>
    </defs>
    <circle cx="40" cy="40" r="40" fill="url(#glow)"/>
    <circle cx="40" cy="40" r="38.5" fill="none" stroke="#d4af37" stroke-width="3"/>
    <!-- Cork -->
    <rect x="34" y="14" width="12" height="8" rx="2" fill="#8b5a2b"/>
