    <circle cx="44" cy="56" r="1.5" fill="#ffffff" fill-opacity="0.7"/>
    <circle cx="41" cy="49" r="1" fill="#ffffff" fill-opacity="0.7"/>
    <path d="M31 39 q2 -5 7 -6" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-opacity="0.8"/>
    <path d="M58 22 l1.5 3.5 3.5 1.5 -3.5 1.5 -1.5 3.5 -1.5 -3.5 -3.5 -1.5 3.5 -1.5 z" fill="#f4e4a6"/>
